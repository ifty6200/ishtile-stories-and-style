name: Build and lint ISHTILE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ishtile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies and refresh lockfile
        run: bun install

      - name: Commit refreshed Bun lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: refresh Bun lockfile"
            git push
          fi

      - name: Production build
        run: bun run build

      - name: TypeScript typecheck
        run: bunx tsc --noEmit

      - name: Format the GSAP integration
        run: bunx prettier --write src/components/storefront/motion-shell.tsx src/components/storefront/app-shell.tsx

      - name: Commit formatting updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- src/components/storefront/motion-shell.tsx src/components/storefront/app-shell.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/storefront/motion-shell.tsx src/components/storefront/app-shell.tsx
            git commit -m "style: format GSAP integration"
            git push
          fi

      - name: Lint the changed motion components
        run: bunx eslint src/components/storefront/motion-shell.tsx src/components/storefront/app-shell.tsx
